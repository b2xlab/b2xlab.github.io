<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2X — Конкурентная разведка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --u: calc(100vw / 1672);      /* 1 px макета 1672×941 */
  --orange:#ff5f00;
  --ink:#0f0f0f;
  --gray:#6b6865;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#ece9e6}
body{font-family:'Inter Tight',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);overflow-x:hidden}

.hero{
  position:relative;
  width:100%;
  height:calc(var(--u) * 941);
  overflow:hidden;
  background:linear-gradient(100deg,#f3f0ed 0%,#ece9e6 45%,#dcd9d6 100%);
}

/* картинка справа с плавным уходом влево */
.hero__img{
  position:absolute; right:0; top:0;
  height:100%; width:calc(var(--u) * 1100);
  object-fit:cover; object-position:right center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);
          mask-image:linear-gradient(90deg,transparent 0%,#000 28%);
  z-index:0;
}

/* ---------- header ---------- */
.header{position:absolute; left:0; top:0; width:100%; height:calc(var(--u)*100); z-index:5}
.logo{
  position:absolute; left:calc(var(--u)*80); top:calc(var(--u)*26);
  display:flex; align-items:center; text-decoration:none; color:var(--ink);
}
.logo__mark{font-size:calc(var(--u)*56); font-weight:800; letter-spacing:calc(var(--u)*-2); line-height:1; transform:scaleX(1.12); transform-origin:left center}
.logo__mark span{color:var(--orange)}
.logo__div{width:1px; height:calc(var(--u)*38); background:#bdb9b5; margin:0 calc(var(--u)*16) 0 calc(var(--u)*30)}
.logo__sub{font-size:calc(var(--u)*11); letter-spacing:calc(var(--u)*3); line-height:calc(var(--u)*15); color:#6e6b68; font-weight:500; text-transform:uppercase}

.nav{position:absolute; left:calc(var(--u)*546); top:calc(var(--u)*45); display:flex; gap:calc(var(--u)*62)}
.nav a{font-size:calc(var(--u)*18); font-weight:500; color:var(--ink); text-decoration:none; transition:color .2s}
.nav a:hover{color:var(--orange)}

.tg{
  position:absolute; left:calc(var(--u)*1315); top:calc(var(--u)*28);
  width:calc(var(--u)*47); height:calc(var(--u)*47); border-radius:50%;
  background:#a9a8a7; display:flex; align-items:center; justify-content:center; text-decoration:none;
}
.tg svg{width:calc(var(--u)*24); height:calc(var(--u)*24)}
.cons{
  position:absolute; left:calc(var(--u)*1382); top:calc(var(--u)*25);
  width:calc(var(--u)*217); height:calc(var(--u)*50); border-radius:999px; border:0;
  background:var(--orange); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*18);
  font:600 calc(var(--u)*18)/1 'Inter Tight',sans-serif;
  box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgba(255,95,0,.28);
}
.cons svg{width:calc(var(--u)*20); height:calc(var(--u)*20)}

/* ---------- content ---------- */
.tag{
  position:absolute; left:calc(var(--u)*82); top:calc(var(--u)*181); z-index:2;
  display:flex; align-items:center; gap:calc(var(--u)*18);
  font-size:calc(var(--u)*15); letter-spacing:calc(var(--u)*4); color:#5f5c59; font-weight:500; text-transform:uppercase;
}
.tag::after{content:""; display:block; width:calc(var(--u)*343); height:1px; background:#c3bfbb}

h1{
  position:absolute; left:calc(var(--u)*78); top:calc(var(--u)*236); z-index:2;
  font-size:calc(var(--u)*100); font-weight:800; line-height:.88; letter-spacing:calc(var(--u)*-3.5);
  color:var(--ink); white-space:nowrap;
}
h1 i{font-style:normal; color:var(--orange)}

.stats{position:absolute; left:calc(var(--u)*80); top:calc(var(--u)*450); display:flex; z-index:2}
.stat{padding-right:calc(var(--u)*32); position:relative}
.stat + .stat{padding-left:calc(var(--u)*32)}
.stat + .stat::before{content:""; position:absolute; left:0; top:0; width:1px; height:calc(var(--u)*134); background:#c9c5c1}
.stat svg{display:block; width:calc(var(--u)*62); height:calc(var(--u)*50); margin-bottom:calc(var(--u)*6)}
.stat b{display:block; font-size:calc(var(--u)*58); font-weight:800; color:var(--orange); line-height:1; letter-spacing:calc(var(--u)*-1)}
.stat span{display:block; font-size:calc(var(--u)*25); font-weight:500; color:var(--ink); margin-top:calc(var(--u)*8); line-height:1}
.stat:nth-child(1){width:calc(var(--u)*183)}
.stat:nth-child(2){width:calc(var(--u)*212)}
.stat:nth-child(3){width:calc(var(--u)*150)}

.desc{
  position:absolute; left:calc(var(--u)*82); top:calc(var(--u)*628); width:calc(var(--u)*520); z-index:2;
  font-size:calc(var(--u)*24); line-height:calc(var(--u)*31); color:var(--gray); font-weight:400;
}

.cta{
  position:absolute; left:calc(var(--u)*80); top:calc(var(--u)*761); z-index:3;
  width:calc(var(--u)*558); height:calc(var(--u)*87); border-radius:999px; border:0; cursor:pointer;
  background:linear-gradient(90deg,#ff7a00 0%,#ff5a00 100%); color:#111;
  display:flex; align-items:center; padding:0 calc(var(--u)*14) 0 calc(var(--u)*34);
  font:500 calc(var(--u)*28)/1 'Inter Tight',sans-serif; white-space:nowrap;
  box-shadow:0 calc(var(--u)*10) calc(var(--u)*28) rgba(255,95,0,.30);
  transition:transform .2s, box-shadow .2s;
}
.cta:hover{transform:translateY(-2px); box-shadow:0 calc(var(--u)*14) calc(var(--u)*34) rgba(255,95,0,.4)}
.cta b{font-weight:800; margin-left:calc(var(--u)*12); letter-spacing:calc(var(--u)*.5)}
.cta__arrow{
  margin-left:auto; width:calc(var(--u)*58); height:calc(var(--u)*58); border-radius:50%;
  background:#111; display:flex; align-items:center; justify-content:center;
}
.cta__arrow svg{width:calc(var(--u)*26); height:calc(var(--u)*26)}

/* ---------- мобильная версия ---------- */
@media (max-width:900px){
  :root{--u:calc(100vw / 480)}
  .hero{height:auto; padding-bottom:calc(var(--u)*40)}
  .hero__img{position:relative; display:block; width:100%; height:auto; margin-top:calc(var(--u)*20);
    -webkit-mask-image:none; mask-image:none}
  .header,.tag,h1,.stats,.desc,.cta{position:relative; left:auto; top:auto}
  .header{height:auto; display:flex; align-items:center; justify-content:space-between; padding:calc(var(--u)*16) calc(var(--u)*20)}
  .logo,.nav,.tg,.cons{position:static}
  .nav,.tg,.logo__sub,.logo__div{display:none}
  .logo__mark{font-size:calc(var(--u)*34)}
  .cons{width:auto; height:calc(var(--u)*40); padding:0 calc(var(--u)*18); font-size:calc(var(--u)*14)}
  .tag{margin:calc(var(--u)*20) calc(var(--u)*20) 0; font-size:calc(var(--u)*11)}
  .tag::after{width:calc(var(--u)*120)}
  h1{margin:calc(var(--u)*14) calc(var(--u)*20); font-size:calc(var(--u)*54); white-space:normal}
  .stats{margin:0 calc(var(--u)*20)}
  .stat,.stat:nth-child(n){width:auto; padding-right:calc(var(--u)*14)}
  .stat + .stat{padding-left:calc(var(--u)*14)}
  .stat + .stat::before{height:calc(var(--u)*90)}
  .stat svg{width:calc(var(--u)*36); height:calc(var(--u)*30)}
  .stat b{font-size:calc(var(--u)*34)}
  .stat span{font-size:calc(var(--u)*15)}
  .desc{width:auto; margin:calc(var(--u)*20); font-size:calc(var(--u)*16); line-height:1.4}
  .cta{width:calc(100% - var(--u)*40); height:calc(var(--u)*60); margin:0 calc(var(--u)*20); font-size:calc(var(--u)*17); padding-left:calc(var(--u)*20)}
  .cta__arrow{width:calc(var(--u)*40); height:calc(var(--u)*40)}
}
</style>
</head>
<body>

<section class="hero">
  <img class="hero__img" src="robot.png" alt="B2X — конкурентная разведка">

  <header class="header">
    <a class="logo" href="#">
      <span class="logo__mark">B2<span>X</span></span>
      <span class="logo__div"></span>
      <span class="logo__sub">Business<br>Transformation<br>Bureau</span>
    </a>

    <nav class="nav">
      <a href="#">Услуги</a>
      <a href="#">Кейсы</a>
      <a href="#">Процесс</a>
      <a href="#">О нас</a>
    </nav>

    <a class="tg" href="#" aria-label="Telegram">
      <svg viewBox="0 0 24 24" fill="#2b2b2b"><path d="M21.5 3.3 2.7 10.6c-.9.4-.9 1.1-.2 1.3l4.8 1.5 1.9 5.7c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8L22.9 4.7c.3-1.3-.5-1.9-1.4-1.4zM8.4 13l9.8-6.2c.5-.3.9-.1.6.2l-8.1 7.3-.3 3.4L8.4 13z"/></svg>
    </a>

    <button class="cons">Консультация
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
    </button>
  </header>

  <div class="tag">01 / Диагностика</div>

  <h1>Конкурентная<br>разведка<i>.</i></h1>

  <div class="stats">
    <div class="stat">
      <svg viewBox="0 0 62 50" fill="none" stroke="#ff5f00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="31" cy="12" r="8"/><path d="M15 44c0-9 7-15 16-15s16 6 16 15z"/>
        <circle cx="10" cy="19" r="5.5"/><path d="M2 40c0-6 4-10 9-10"/>
        <circle cx="52" cy="19" r="5.5"/><path d="M60 40c0-6-4-10-9-10"/>
      </svg>
      <b>5</b><span>конкурентов</span>
    </div>
    <div class="stat">
      <svg viewBox="0 0 62 50" fill="none" stroke="#ff5f00" stroke-width="3.2" stroke-linejoin="round">
        <rect x="3" y="24" width="12" height="22" rx="1.5"/>
        <rect x="21" y="4" width="12" height="42" rx="1.5"/>
        <rect x="39" y="16" width="12" height="30" rx="1.5"/>
      </svg>
      <b>3</b><span>точки роста</span>
    </div>
    <div class="stat">
      <svg viewBox="0 0 62 50" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round">
        <circle cx="25" cy="25" r="21"/><path d="M25 12v14h11"/>
      </svg>
      <b>15</b><span>минут</span>
    </div>
  </div>

  <p class="desc">Сравним предложения конкурентов, найдём возможности выделиться и предложим три улучшения для вашего сайта.</p>

  <button class="cta">Получить анализ <b>БЕСПЛАТНО</b>
    <span class="cta__arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
    </span>
  </button>
</section>

</body>
</html>
