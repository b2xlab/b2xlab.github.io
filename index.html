<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2X — Конкурентная разведка</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f8f9fb; color:#111; }
.header { display:flex; justify-content:space-between; align-items:center; padding:20px 5%; max-width:1400px; margin:0 auto; }
.logo { font-size:28px; font-weight:800; letter-spacing:-1px; }
.logo span { color:#ff6a00; }
.nav { display:flex; gap:32px; }
.nav a { text-decoration:none; color:#333; font-weight:500; font-size:15px; }
.nav a:hover { color:#ff6a00; }
.btn-cons { background:#ff6a00; color:#fff; border:none; padding:12px 24px; border-radius:30px; font-weight:600; cursor:pointer; }
.hero { display:flex; align-items:center; gap:40px; padding:40px 5% 80px; max-width:1400px; margin:0 auto; }
.left { flex:1; }
.right { flex:1; text-align:center; }
.tag { color:#ff6a00; font-size:14px; font-weight:600; margin-bottom:16px; letter-spacing:1px; }
h1 { font-size:clamp(36px, 6vw, 64px); font-weight:800; line-height:1.1; margin-bottom:30px; }
.stats { display:flex; gap:40px; margin-bottom:30px; flex-wrap:wrap; }
.stat { text-align:center; }
.stat .num { font-size:32px; font-weight:800; color:#ff6a00; }
.stat .label { font-size:14px; color:#555; margin-top:4px; }
.desc { font-size:17px; line-height:1.6; color:#444; max-width:480px; margin-bottom:35px; }
.btn-main { background:#ff6a00; color:#fff; border:none; padding:16px 32px; border-radius:40px; font-size:16px; font-weight:700; cursor:pointer; }
.robot { max-width:100%; height:auto; border-radius:20px; }
@media (max-width:900px) {
  .hero { flex-direction:column; text-align:center; }
  .nav { display:none; }
  .stats { justify-content:center; }
  .desc { margin:0 auto 35px; }
}
</style>
</head>
<body>
<header class="header">
  <div class="logo">B2<span>X</span></div>
  <nav class="nav">
    <a href="#">Услуги</a>
    <a href="#">Кейсы</a>
    <a href="#">Процесс</a>
    <a href="#">О нас</a>
  </nav>
  <button class="btn-cons">Консультация →</button>
</header>

<section class="hero">
  <div class="left">
    <div class="tag">01 / ДИАГНОСТИКА</div>
    <h1>Конкурентная<br>разведка.</h1>
    <div class="stats">
      <div class="stat">
        <div class="num">5</div>
        <div class="label">конкурентов</div>
      </div>
      <div class="stat">
        <div class="num">3</div>
        <div class="label">точки роста</div>
      </div>
      <div class="stat">
        <div class="num">15</div>
        <div class="label">минут</div>
      </div>
    </div>
    <p class="desc">Сравним предложения конкурентов, найдём возможности выделиться и предложим три улучшения для вашего сайта.</p>
    <button class="btn-main">Получить анализ БЕСПЛАТНО →</button>
  </div>
  <div class="right">
    <img class="robot" src="robot.png" alt="B2X">
  </div>
</section>
</body>
</html>
